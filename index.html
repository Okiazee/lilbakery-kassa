<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --mist: #f3f8f8;
  --line: #d9e9ea;
  --line-strong: #a9d3d6;
  --blue: #a9d3d6;
  --blue-deep: #5f9ba0;
  --blue-ink: #3b7a80;
  --ink: #2f4a4d;
  --muted: #6d8688;
  --pink: #f3a6b4;
  --pink-deep: #e2808f;
  --pink-ink: #c4536a;
  --good: #35915f; --good-bg: #e3f3ea;
  --warn: #b97d12; --warn-bg: #fbf0d6;
  --bad: #cf4b47; --bad-bg: #fbe4e3;
  --cat-blue: #dceef0; --cat-pink: #fbe3e8; --cat-mint: #e0f2e6; --cat-butter: #fcf1d3; --cat-lavender: #ebe6f6; --cat-peach: #fde6d7;
  --cat-blue-ink: #3b7a80; --cat-pink-ink: #c4536a; --cat-mint-ink: #35915f; --cat-butter-ink: #b8891a; --cat-lavender-ink: #6f5fa8; --cat-peach-ink: #c9683a;
  --radius: 14px; --radius-lg: 20px;
  --shadow: 0 1px 2px rgba(47,74,77,.06), 0 10px 30px rgba(47,74,77,.12);
  --font: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --script: 'Sacramento', 'Brush Script MT', 'Snell Roundhand', cursive;
  --topbar: 64px;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; touch-action: manipulation; overscroll-behavior-y: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h2 { font-size: 17px; font-weight: 800; }
p { margin: 0 0 10px; }
small { font-size: 13px; }
:focus-visible { outline: 3px solid var(--blue-deep); outline-offset: 2px; }
.muted { color: var(--muted); }
.num, .tabular { font-variant-numeric: tabular-nums; }
.strike { text-decoration: line-through; opacity: .6; }
.hidden { display: none !important; }

/* ---------- App frame ---------- */
.app { min-height: 100dvh; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; min-height: var(--topbar); padding: 6px 16px; padding-top: calc(6px + env(safe-area-inset-top)); background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; }
.brand-cup { height: 42px; width: auto; }
.brand-word { height: 30px; width: auto; margin-top: 6px; }
.tabs { display: flex; gap: 2px; margin-left: auto; }
.tab { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 14px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-weight: 800; font-size: 15px; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.tab.is-active { background: var(--mist); color: var(--blue-ink); }
.tab { position: relative; }
.tab-short { display: none; }
.tab-badge { position: absolute; top: -2px; right: -2px; display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--pink-ink); color: #fff; font-size: 11px; font-weight: 800; box-shadow: 0 0 0 2px var(--bg); }
@media (min-width: 760px) and (max-width: 1279px) {
  .topbar { gap: 10px; }
  .tab { flex-direction: column; gap: 2px; min-height: 52px; padding: 4px 8px; font-size: 11px; border-radius: 12px; }
}
@media (min-width: 760px) and (max-width: 899px) { #clock { display: none; } }
.topbar-right { display: flex; align-items: center; gap: 10px; color: var(--muted); font-weight: 700; font-size: 14px; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
main { flex: 1; width: 100%; max-width: 1400px; margin: 0 auto; padding: 16px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }

/* ---------- Buttons & inputs ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: #fff; color: var(--blue-ink); font-weight: 800; text-decoration: none; }
.btn.small { min-height: 40px; padding: 6px 14px; font-size: 14px; }
.btn.big { min-height: 60px; font-size: 18px; padding: 12px 26px; }
.btn.primary { background: var(--blue-deep); border-color: var(--blue-deep); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.danger-ghost { border-color: var(--bad-bg); background: var(--bad-bg); color: var(--bad); }
.btn.is-on { background: var(--cat-pink); border-color: var(--pink); color: var(--pink-ink); }
.btn:disabled { opacity: .4; pointer-events: none; }
.btn.pay { flex: 1; min-height: 64px; font-size: 19px; border: 0; color: #fff; }
.btn.pay.swish { background: var(--pink-deep); }
.btn.pay.cash { background: var(--blue-deep); }
.icon-btn { width: 40px; height: 40px; border-radius: 999px; border: 0; background: var(--mist); color: var(--muted); font-size: 22px; line-height: 1; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; font-weight: 800; font-size: 14px; color: var(--ink); white-space: nowrap; }
.chip.is-active { border-color: var(--blue-deep); background: var(--blue-deep); color: #fff; }
.chip.is-active .dot { box-shadow: 0 0 0 2px #fff inset; }
.chip-strong { border-color: var(--blue-deep); color: var(--blue-ink); }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(47,74,77,.15); }
.chip-art { width: 22px; height: 22px; color: var(--chip-ink, currentColor); flex: none; }
.chip-art.is-photo { border-radius: 50%; object-fit: cover; }
.chip.is-active .chip-art { color: #fff; }
.input { min-height: 48px; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; width: 100%; }
.input:focus { outline: none; border-color: var(--blue-deep); box-shadow: 0 0 0 3px rgba(95,155,160,.2); }
textarea.input { min-height: 80px; resize: vertical; }
select.input { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 40px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field > span, .field > label { font-size: 13px; font-weight: 800; color: var(--muted); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.check { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 700; }
.check input { width: 22px; height: 22px; accent-color: var(--blue-deep); }
.seg { display: flex; gap: 6px; padding: 4px; border-radius: 999px; background: var(--mist); margin-bottom: 12px; }
.seg-btn { flex: 1; min-height: 42px; border: 0; border-radius: 999px; background: transparent; font-weight: 800; color: var(--muted); }
.seg-btn.is-active { background: #fff; color: var(--blue-ink); box-shadow: 0 1px 3px rgba(47,74,77,.15); }
.hint { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
.notice { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius); background: var(--cat-butter); color: #6b5410; font-weight: 600; margin-bottom: 14px; }
.notice .btn { margin-left: auto; }

/* ---------- Page scaffolding ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 14px; }
.page-head h1 { font-size: 24px; font-weight: 800; margin-right: auto; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.toolbar .input { width: auto; }
.lead { color: var(--muted); font-weight: 600; margin-bottom: 14px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px 18px; }
.card + .card { margin-top: 14px; }
.card h2 { margin-bottom: 12px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 14px 0; }
@media (max-width: 899px) { .two-col { grid-template-columns: 1fr; } }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { padding: 12px 14px; border-radius: var(--radius); background: var(--mist); }
.stat-label { display: block; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.stat-value { display: block; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat-value small { font-size: 14px; color: var(--muted); font-weight: 700; }
.stat.swish { background: var(--cat-pink); } .stat.cash { background: var(--cat-blue); }
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.table th, .table td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.table th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.table td.num, .table th.num { text-align: right; white-space: nowrap; }
.table tr.total td { font-weight: 800; border-bottom: 0; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.kv:last-child { border-bottom: 0; }
.kv b { white-space: nowrap; }
.kv.big { font-size: 20px; }
.diff-good { color: var(--good); } .diff-bad { color: var(--bad); } .diff-warn { color: var(--warn); }
.list { display: flex; flex-direction: column; gap: 6px; }
.row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; text-align: left; }
.row.is-off { opacity: .55; }
.row-nr { font-weight: 800; color: var(--blue-ink); font-variant-numeric: tabular-nums; }
.row-main { min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row-side { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.row-sum { font-variant-numeric: tabular-nums; }
.row-emoji { width: 32px; text-align: center; font-size: 22px; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
.badge.ok { background: var(--good-bg); color: var(--good); }
.badge.void, .badge.off { background: var(--bad-bg); color: var(--bad); }
.badge.swish { background: var(--cat-pink); color: var(--pink-ink); }
.badge.kontant { background: var(--cat-blue); color: var(--blue-ink); }
.badge.vat { background: var(--mist); color: var(--muted); }
.group { margin-bottom: 18px; }
.group-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 6px 4px; color: var(--muted); font-weight: 700; }
.group-head b { color: var(--ink); text-transform: capitalize; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); font-weight: 600; border: 1.5px dashed var(--line); border-radius: var(--radius-lg); }
.empty.small { padding: 24px 12px; border: 0; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.btn-row.end { justify-content: flex-end; }
.fine { font-size: 13px; color: var(--muted); }
.steps { margin: 0; padding-left: 20px; }
.steps li { margin-bottom: 6px; }

/* ---------- Kassa ---------- */
.kassa { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
@media (max-width: 1023px) {
  .kassa { grid-template-columns: minmax(0, 1fr) 320px; }
  .line { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: 'name sum' 'qty qty'; row-gap: 6px; }
  .line-name { grid-area: name; overflow-wrap: break-word; } .line-sum { grid-area: sum; align-self: start; } .line .qty { grid-area: qty; justify-self: start; }
}
.cat-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.search { flex: 1; min-width: 160px; margin-left: auto; }
.search .input { min-height: 42px; border-radius: 999px; padding: 6px 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { position: relative; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; gap: 8px; min-height: 100px; padding: 12px 14px; border: 1.5px solid transparent; border-radius: var(--radius); background: var(--tile, var(--mist)); text-align: left; transition: transform .08s ease; }
.tile:active { transform: scale(.96); border-color: var(--blue-deep); }
.tile-emoji { font-size: 24px; line-height: 1; }
.tile-name { font-weight: 800; font-size: 16px; line-height: 1.2; overflow-wrap: anywhere; }
.tile-price { font-weight: 800; color: var(--blue-ink); font-variant-numeric: tabular-nums; }
.art { stroke: currentColor; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; display: block; }
.tile-art { width: 34px; height: 34px; flex: none; color: var(--tile-ink, var(--blue-ink)); }
.tile-art.is-photo { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; box-shadow: 0 1px 3px rgba(47,74,77,.25); }
.tile-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; width: 100%; }
.tile-name.is-long { font-size: 14px; line-height: 1.25; }
.tile.needs-price { border-style: dashed; border-color: var(--tile-ink, var(--line-strong)); }
.tile-price.no-price { color: var(--warn); }
.price-note { padding: 10px 14px; margin-bottom: 12px; border-radius: var(--radius); background: var(--warn-bg); color: var(--warn); font-weight: 700; }
.tile-qty { position: absolute; top: -8px; right: -8px; min-width: 28px; height: 28px; padding: 0 8px; border-radius: 999px; background: var(--pink-ink); color: #fff; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px var(--bg); }
.cart-pane { position: sticky; top: calc(var(--topbar) + 12px); display: flex; flex-direction: column; max-height: calc(100dvh - var(--topbar) - 28px); background: var(--mist); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }
.cart-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.cart-title { font-weight: 800; font-size: 18px; }
.cart-nr { color: var(--muted); font-weight: 700; }
.cart-head-btns { display: flex; gap: 4px; }
.cart-close { display: none; }
.cart-lines { flex: 1; min-height: 120px; overflow-y: auto; padding: 6px 12px; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--line); }
.line:last-child { border-bottom: 0; }
.line-name { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.line-name small { display: block; color: var(--muted); font-weight: 600; }
.qty { display: inline-flex; align-items: center; gap: 2px; }
.qty span { min-width: 30px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.qty-btn { width: 38px; height: 38px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: #fff; color: var(--blue-ink); font-size: 20px; font-weight: 800; line-height: 1; }
.line-sum { min-width: 64px; text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
.cart-foot { padding: 12px 16px 16px; border-top: 1px solid var(--line); background: #fff; }
.cart-tools { display: flex; gap: 8px; margin-bottom: 10px; }
.cart-tools .btn { flex: 1; }
.cart-sub { display: flex; justify-content: space-between; color: var(--muted); font-weight: 700; padding: 2px 0; font-variant-numeric: tabular-nums; }
.cart-total { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0 12px; font-weight: 800; }
.cart-total b { font-size: 30px; font-variant-numeric: tabular-nums; }
.pay-row { display: flex; gap: 10px; }
.cart-bar { display: none; }

/* ---------- Modals ---------- */
.modal-wrap { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(47,74,77,.38); }
.modal { width: min(520px, 100%); max-height: calc(100dvh - 32px); display: flex; flex-direction: column; background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow); overflow: hidden; animation: pop .16s ease-out; }
.modal.wide { width: min(760px, 100%); }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 19px; }
.modal-body { padding: 16px 20px; overflow-y: auto; }
.modal-foot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--mist); }
.modal-foot .btn.big { flex: 1; }
.modal-text { font-size: 16px; }
@keyframes pop { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }

.pay-total { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 16px; border-radius: var(--radius); background: var(--mist); margin-bottom: 12px; font-weight: 800; }
.pay-total b { font-size: 34px; font-variant-numeric: tabular-nums; }
.quick-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.keypad-display { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; min-height: 58px; padding: 10px 16px; margin-bottom: 12px; border-radius: var(--radius); border: 1.5px solid var(--line); }
.keypad-label { font-weight: 800; color: var(--muted); }
.keypad-value { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; min-height: 1.2em; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.key { min-height: 56px; border-radius: var(--radius); border: 1px solid var(--line); background: #fff; font-size: 22px; font-weight: 700; }
.key:active { background: var(--mist); }
.change-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; padding: 10px 16px; border-radius: var(--radius); background: var(--cat-blue); font-weight: 800; }
.change-row b { font-size: 28px; font-variant-numeric: tabular-nums; }
.change-row.short { background: var(--warn-bg); color: var(--warn); }
.swish-box { display: flex; justify-content: center; margin: 4px auto 10px; max-width: 300px; }
.swish-box svg { width: 100%; height: auto; display: block; }
.swish-number { text-align: center; font-size: 18px; margin: 0 0 4px; }
.swish-number b { font-variant-numeric: tabular-nums; }
.done { text-align: center; padding: 8px 0 4px; }
.done-title { font-family: var(--script); font-size: 64px; line-height: 1; color: var(--blue-ink); margin-bottom: 4px; }
.done-sum { font-size: 20px; font-weight: 800; }
.done-change { margin: 14px auto 0; max-width: 300px; padding: 12px 16px; border-radius: var(--radius); background: var(--cat-pink); color: var(--pink-ink); font-weight: 800; }
.done-change b { display: block; font-size: 40px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.done-nr { color: var(--muted); font-weight: 700; margin-top: 10px; }

/* ---------- Receipt paper ---------- */
.paper { position: relative; margin: 0 auto; max-width: 380px; padding: 18px 20px; background: #fff; border: 1.5px dashed var(--line-strong); border-radius: 6px; font-size: 15px; font-variant-numeric: tabular-nums; }
.paper-brand { text-align: center; margin-bottom: 6px; }
.paper-brand img { height: 64px; width: auto; }
.paper-meta { text-align: center; color: var(--muted); font-size: 13px; font-weight: 600; }
.paper hr { border: 0; border-top: 1.5px dashed var(--line-strong); margin: 10px 0; }
.paper-line { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }
.paper-line span:last-child { white-space: nowrap; }
.paper-total { font-size: 20px; font-weight: 800; }
.paper-vat { color: var(--muted); font-size: 13px; }

function cartTotals(cart = state.cart) {
  const lines = cart.lines;

    amount = Math.max(0, Math.min(amount, gross));

  for (const l of lines) byRate.set(l.vat, r2((byRate.get(l.vat) || 0) + l.price * l.qty));

function daySummary(day) {
  const all = state.receipts.filter((r) => r.day === day).sort((a, b) => a.ts.localeCompare(b.ts));
  const ok = all.filter((r) => r.status === 'ok'); const voided = all.filter((r) => r.status !== 'ok');
  const total = r2(sum(ok, (r) => r.total));
  const swish = r2(sum(ok.filter((r) => r.payment === 'swish'), (r) => r.total));
  const cash = r2(sum(ok.filter((r) => r.payment === 'kontant'), (r) => r.total));
  const vat = new Map();
  ok.forEach((r) => r.vatLines.forEach((v) => { const c = vat.get(v.rate) || { rate: v.rate, net: 0, vat: 0, gross: 0 }; c.net = r2(c.net + v.net); c.vat = r2(c.vat + v.vat); c.gross = r2(c.gross + v.gross); vat.set(v.rate, c); }));
  const prod = new Map();
  ok.forEach((r) => r.lines.forEach((l) => { const c = prod.get(l.name) || { name: l.name, qty: 0, sum: 0 }; c.qty += l.qty; c.sum = r2(c.sum + l.price * l.qty); prod.set(l.name, c); }));
  return {
    day, count: ok.length, total, swish, cash,
    vat: [...vat.values()].sort((a, b) => b.rate - a.rate),
    discounts: r2(sum(ok.filter((r) => r.discount), (r) => r.discount.amount)),
    codes: [...ok.filter((r) => r.discount && r.discount.codeId).reduce((m, r) => { const k = r.discount.codeId; const c = m.get(k) || { code: r.discount.code || '', count: 0, amount: 0 }; c.count += 1; c.amount = r2(c.amount + r.discount.amount); return m.set(k, c); }, new Map()).values()].sort((a, b) => b.amount - a.amount),
    voidedCount: voided.length, voidedSum: r2(sum(voided, (r) => r.total)),
    products: [...prod.values()].sort((a, b) => b.sum - a.sum),
    first: ok.length ? timeOf(ok[0].ts) : '', last: ok.length ? timeOf(ok[ok.length - 1].ts) : ''
  };
}

function openModal({ title = '', body = '', footer = '', cls = '', dismissable = true, onClose } = {}) {
  const root = $('#modal-root'); const wrap = document.createElement('div'); wrap.className = 'modal-wrap';
  wrap.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true" ${title ? `aria-label="${esc(title)}"` : ''}>
    ${title ? `<div class="modal-head"><h2>${esc(title)}</h2>${dismissable ? '<button class="icon-btn" data-close aria-label="Stäng">×</button>' : ''}</div>` : ''}
    <div class="modal-body">${body}</div>${footer ? `<div class="modal-foot">${footer}</div>` : ''}</div>`;
  root.appendChild(wrap);
  let closed = false;
  const close = (result) => { if (closed) return; closed = true; wrap.remove(); document.removeEventListener('keydown', onKey); if (onClose) onClose(result); };
  const onKey = (e) => { if (e.key === 'Escape' && dismissable) close(); };
  document.addEventListener('keydown', onKey);
  wrap.addEventListener('click', (e) => { if ((e.target === wrap && dismissable) || e.target.closest('[data-close]')) close(); });
  return { el: wrap, close };
}

function mountKeypad(container, { initial = '', decimal = false, maxLen = 9, onChange }) {
  let val = String(initial || '');
  container.innerHTML = `<div class="keypad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', decimal ? ',' : '', '0', '⌫'].map((k) => k ? `<button class="key" data-key="${k}" aria-label="${k === '⌫' ? 'Radera' : k}">${k}</button>` : '<span></span>').join('')}</div>`;
  const set = (v) => { val = v; if (onChange) onChange(val); };
  const press = (k) => {
    if (k === '⌫') set(val.slice(0, -1));
    else if (k === ',') { if (decimal && !val.includes(',')) set((val || '0') + ','); }
    else if (val.length < maxLen) set(val === '0' ? k : val + k);
  };
  container.addEventListener('click', (e) => { const b = e.target.closest('[data-key]'); if (b) press(b.dataset.key); });
  const onKey = (e) => {
    if (!container.isConnected) { document.removeEventListener('keydown', onKey); return; }
    const tag = document.activeElement && document.activeElement.tagName; if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (/^\d$/.test(e.key)) { press(e.key); e.preventDefault(); }
    else if (e.key === 'Backspace') { press('⌫'); e.preventDefault(); }
    else if ((e.key === ',' || e.key === '.') && decimal) { press(','); e.preventDefault(); }
    else if (e.key === 'Enter') { const ok = container.closest('.modal')?.querySelector('[data-ok]'); if (ok && !ok.disabled) { ok.click(); e.preventDefault(); } }
  };
  document.addEventListener('keydown', onKey);
  return { get: () => val, set, number: () => (val === '' ? null : parseNum(val)) };
}

let driveTimer = null; let driveBusy = false;

// Kassan skickar utan app, fakturaappen med app: 'faktura'. Båda mejlar med action: 'mail'.
function doPost(e) {
  try {
    const data = JSON.parse(e.postData.contents);
    if (data.key !== NYCKEL) return svar({ ok: false, error: 'Fel nyckel' });
    if (data.action === 'mail') return skickaMejl(data);

function doGet(e) {

  const dag = /^\\d{4}-\\d{2}-\\d{2}$/.test(data.day || '') ? data.day : Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd');
  const json = JSON.stringify(data.backup);

function sparaPdf(mapp, namn, pdf) {

// ---------- Uppdatering ----------
async function checkForUpdate(btn) {
  if (IN_PREVIEW || !('serviceWorker' in navigator)) { toast('Förhandsvisningen visar alltid senaste versionen.'); return; }
  if (navigator.onLine === false) { toast('Ingen internetanslutning. Sök igen när enheten är uppkopplad.', 'bad'); return; }
  const reg = await navigator.serviceWorker.getRegistration();
  if (!reg) { location.reload(); return; }
  const reset = () => { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = 'Sök efter uppdatering'; } };
  if (btn) { btn.disabled = true; btn.textContent = 'Söker…'; }
  let found = false; const onFound = () => { found = true; };
  reg.addEventListener('updatefound', onFound);
  try { await reg.update(); }
  catch (e) { reset(); toast('Kunde inte söka efter uppdatering. Kontrollera internetanslutningen.', 'bad'); return; }
  finally { reg.removeEventListener('updatefound', onFound); }
  if (found || reg.installing || reg.waiting) {
    toast('Ny version hittad. Kassan startar om…', 'ok', { persist: true });
    setTimeout(() => location.reload(), 5000);
  } else { reset(); toast(`Kassan har senaste versionen, ${APP_VERSION}.`); }
}

  if (!(await requirePin('Återställning kräver PIN'))) return false;
  n.nextReceiptNr = Math.max(n.nextReceiptNr || 1, ...n.receipts.map((r) => r.nr + 1), 1);

function restore() {

}
